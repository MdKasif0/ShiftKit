name: ShiftKit CI & Reliability Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test macOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -scheme ShiftKit -project ShiftKit.xcodeproj

      - name: Build ShiftKit (Release Configuration)
        run: |
          xcodebuild build \
            -scheme ShiftKit \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Full Test Suite (166 Unit & Integration Tests)
        run: |
          xcodebuild test \
            -scheme ShiftKit \
            -destination 'platform=macOS' \
            -resultBundlePath test_results.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftkit-test-results
          path: test_results.xcresult
