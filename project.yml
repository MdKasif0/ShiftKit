name: ShiftKit
options:
  bundleIdPrefix: com.shiftkit
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  ShiftKit:
    type: application
    platform: macOS
    sources:
      - path: ShiftKit
        excludes:
          - "Resources/Info.plist"
          - "Resources/ShiftKit.entitlements"
    info:
      path: ShiftKit/Resources/Info.plist
      properties:
        CFBundleDisplayName: ShiftKit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "© 2026 ShiftKit. All rights reserved."
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        CFBundleIconFile: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftkit.mac
        COMBINE_HIDPI_IMAGES: "YES"
        CODE_SIGN_ENTITLEMENTS: ShiftKit/Resources/ShiftKit.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"

  ShiftKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShiftKitTests
    dependencies:
      - target: ShiftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiftkit.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "NO"

schemes:
  ShiftKit:
    build:
      targets:
        ShiftKit: all
        ShiftKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShiftKitTests
